<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>try{const s=JSON.parse(localStorage.getItem('openfab.settings.v1')||'{}');const t=s.theme&&s.theme!=='system'?s.theme:(s.theme==='system'?null:localStorage.getItem('openfab.theme'));if(t)document.documentElement.dataset.theme=t;}catch{}</script>
<title>OpenFab CAD/CAM</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#2b3440">
<script>
// Browser version: the service worker (only in the built web package) keeps the app available offline.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => fetch('sw.js', { method: 'HEAD' }).then(r => { if (r.ok) navigator.serviceWorker.register('sw.js'); }).catch(() => {}));
}
</script>
<script src="vendor/clipper/clipper.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/",
    "three-mesh-bvh": "./vendor/three-mesh-bvh/index.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="dataBtn" class="icon-btn appbtn" title="Datenpanel ein-/ausblenden"><svg viewBox="0 0 20 20" width="18" height="18"><g fill="currentColor"><rect x="2" y="2" width="4" height="4" rx=".8"/><rect x="8" y="2" width="4" height="4" rx=".8"/><rect x="14" y="2" width="4" height="4" rx=".8"/><rect x="2" y="8" width="4" height="4" rx=".8"/><rect x="8" y="8" width="4" height="4" rx=".8"/><rect x="14" y="8" width="4" height="4" rx=".8"/><rect x="2" y="14" width="4" height="4" rx=".8"/><rect x="8" y="14" width="4" height="4" rx=".8"/><rect x="14" y="14" width="4" height="4" rx=".8"/></g></svg></button>
    <div class="menu" tabindex="0">
      <button class="menu-btn appbtn filebtn" title="Datei"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M5 2h7l4 4v12H5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v4h4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="caret">▾</span></button>
      <div class="menu-list">
        <button data-act="new">Neues Design <kbd>Strg+N</kbd></button>
        <button data-act="data">Datenpanel öffnen…</button>
        <button data-act="open">Von meinem Computer öffnen…</button>
        <hr>
        <button data-act="save">Speichern (neue Version) <kbd>Strg+S</kbd></button>
        <button data-act="saveas">Speichern unter…</button>
        <button data-act="export">Exportieren (.ofab)…</button>
        <hr>
        <button data-act="import">Einfügen: STEP / IGES / STL / OBJ…</button>
        <button data-act="step">Als STEP exportieren</button>
        <button data-act="iges">Als IGES exportieren</button>
        <button data-act="stl">Als STL exportieren (3D-Druck)</button>
        <hr>
        <button data-act="example">Beispiel: Grundplatte</button>
        <button data-act="example-turn">Beispiel: Drehteil</button>
        <hr>
        <button data-act="settings">Voreinstellungen…</button>
      </div>
    </div>
    <button id="saveBtn" class="icon-btn appbtn" title="Speichern – neue Version (Strg+S)"><svg viewBox="0 0 20 20" width="17" height="17"><path d="M3 3h11l3 3v11H3z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 3v5h7V3M6 17v-5h8v5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button id="undoBtn" class="icon-btn appbtn" title="Rückgängig (Strg+Z)">↶</button>
    <button id="redoBtn" class="icon-btn appbtn" title="Wiederholen (Strg+Y)">↷</button>
    <div id="docTabs"></div>
    <div id="projectName" contenteditable="true" spellcheck="false" title="Klicken zum Umbenennen"></div>
    <div class="spacer"></div>
    <div id="status"></div>
    <div class="menu" tabindex="0">
      <button class="menu-btn appbtn" title="Fenster ein-/ausblenden"><svg viewBox="0 0 20 20" width="17" height="17"><rect x="2.5" y="3.5" width="15" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 7h15M8 7v9.5" stroke="currentColor" stroke-width="1.4"/></svg><span class="caret">▾</span></button>
      <div class="menu-list menu-right" id="windowMenu"></div>
    </div>
    <button id="searchBtn" class="icon-btn appbtn" title="Befehl suchen (S)">⌕</button>
    <button id="themeBtn" class="icon-btn appbtn" title="Hell/Dunkel umschalten">◐</button>
    <button id="helpBtn" class="icon-btn appbtn" title="Hilfe: Tastenkürzel und Maus">?</button>
    <button id="settingsBtn" class="icon-btn appbtn" title="Voreinstellungen">⚙</button>
  </header>

  <nav id="toolbar">
    <div class="ws">
      <select id="workspace">
        <option value="design">KONSTRUKTION</option>
        <option value="cam">FERTIGUNG</option>
        <option value="render">RENDERN</option>
      </select>
    </div>
    <div class="tb-right"><div id="tabs"></div><div id="tools"></div></div>
  </nav>

  <main id="main">
    <aside id="dataPanel" hidden></aside>
    <section id="viewportWrap">
      <div id="viewport"></div>
      <div id="cubeWrap">
        <button id="cubeHome" title="Ausgangsansicht (Iso)">⌂</button>
        <canvas id="viewCube" width="120" height="120" title="ViewCube: Fläche, Kante oder Ecke anklicken"></canvas>
        <button class="cube-arrow up" data-turn="up" title="Nach oben drehen (90°)"></button>
        <button class="cube-arrow down" data-turn="down" title="Nach unten drehen (90°)"></button>
        <button class="cube-arrow left" data-turn="left" title="Nach links drehen (90°)"></button>
        <button class="cube-arrow right" data-turn="right" title="Nach rechts drehen (90°)"></button>
        <button class="cube-roll ccw" data-turn="rollCCW" title="Ansicht gegen den Uhrzeigersinn rollen (90°)">↺</button>
        <button class="cube-roll cw" data-turn="rollCW" title="Ansicht im Uhrzeigersinn rollen (90°)">↻</button>
      </div>
      <div id="cursorTip" hidden></div>
      <div id="loading"><div class="spinner"></div><div id="loadingText">CAD-Kern (OpenCascade) wird geladen …</div></div>
      <div id="banner" hidden></div>
      <div id="navBar">
        <button data-nav="orbit" class="on" title="Orbit (linke Maustaste)">⟳</button>
        <button data-nav="pan" title="Verschieben (linke Maustaste)">✥</button>
        <button data-nav="fit" title="Einpassen (F)">⤢</button>
        <span class="nav-sep"></span>
        <button data-view="top" title="Ansicht oben">Oben</button>
        <button data-view="front" title="Ansicht vorne">Vorne</button>
        <button data-view="right" title="Ansicht rechts">Rechts</button>
        <button data-view="iso" title="Isometrisch">Iso</button>
        <span class="nav-sep"></span>
        <button data-display="edges" class="on" title="Schattiert mit Kanten">◧</button>
        <button data-display="shaded" title="Schattiert">◼</button>
        <button data-display="wire" title="Drahtmodell">▢</button>
        <button data-nav="grid" class="on" title="Raster ein/aus">#</button>
      </div>
      <div id="simBar" hidden>
        <button id="simReset" title="Zurück zum Anfang">⏮</button>
        <button id="simPlay" title="Abspielen / Pause">▶</button>
        <input id="simProgress" type="range" min="0" max="1000" value="0">
        <select id="simSpeed">
          <option value="1">1×</option><option value="5">5×</option><option value="20" selected>20×</option>
          <option value="60">60×</option><option value="200">200×</option><option value="1000">1000×</option>
        </select>
        <label class="chk"><input id="simModel" type="checkbox"> Modell</label>
        <label class="chk"><input id="simPaths" type="checkbox"> Wege</label>
        <label class="chk" title="Mit dem Fertigteil vergleichen: grün = auf Maß, blau = Restmaterial, rot = zu tief"><input id="simCompare" type="checkbox"> Vergleich</label>
        <span id="simInfo"></span>
        <button id="simClose" title="Simulation schließen">✕</button>
      </div>
    </section>

    <!-- floating windows (see js/windows.js) -->
    <section class="fwin" id="winBrowser" data-title="Browser">
      <header class="fwin-head"><span class="fw-title">BROWSER</span></header>
      <div class="fwin-body"><div id="tree"></div></div>
    </section>

    <section class="fwin" id="winProps" data-title="Eigenschaften">
      <header class="fwin-head"><span class="fw-icon" id="propsIcon"></span><span class="fw-title" id="propsTitle">EIGENSCHAFTEN</span></header>
      <div class="fwin-body"><div id="propsBody"></div></div>
      <footer class="fwin-foot" id="propsFoot" hidden>
        <span class="foot-info" id="propsInfo" title="Änderungen werden sofort in der Vorschau angezeigt. OK übernimmt, Abbrechen verwirft alle Änderungen dieses Dialogs.">ⓘ</span>
        <span class="foot-msg" id="propsMsg"></span>
        <button class="primary" id="propsOk">OK</button>
        <button id="propsCancel">Abbrechen</button>
      </footer>
    </section>

    <section class="fwin" id="winComments" data-title="Kommentare">
      <header class="fwin-head"><span class="fw-title">KOMMENTARE</span><button class="fw-btn fw-add" id="commentAdd" title="Kommentar hinzufügen">+</button></header>
      <div class="fwin-body" id="commentList"></div>
    </section>

    <section class="fwin" id="winTimeline" data-title="Zeitachse">
      <header class="fwin-head"><span class="fw-title">ZEITACHSE</span></header>
      <div class="fwin-body tl-body">
        <div class="tl-controls">
          <button data-tl="start" title="Zum Anfang">⏮</button>
          <button data-tl="back" title="Einen Schritt zurück">◀</button>
          <button data-tl="fwd" title="Einen Schritt vor">▶</button>
          <button data-tl="end" title="Zum Ende">⏭</button>
        </div>
        <div id="tlItems"></div>
      </div>
    </section>

    <section class="fwin" id="winMachines" data-title="Maschinenbibliothek" data-closable="1" hidden>
      <header class="fwin-head"><span class="fw-title">MASCHINENBIBLIOTHEK</span></header>
      <div class="fwin-body" id="machineLib"></div>
    </section>

    <section class="fwin" id="winPost" data-title="Postprozessor-Editor" data-closable="1" hidden>
      <header class="fwin-head"><span class="fw-title">POSTPROZESSOR-EDITOR</span></header>
      <div class="fwin-body" id="postEd"></div>
    </section>

    <section class="fwin" id="winDrawing" data-title="Zeichnung" data-closable="1" hidden>
      <header class="fwin-head"><span class="fw-title">ZEICHNUNGSABLEITUNG</span></header>
      <div class="fwin-body" id="drawingView"></div>
    </section>

    <section class="fwin" id="winTools" data-title="Werkzeugbibliothek" data-closable="1" hidden>
      <header class="fwin-head"><span class="fw-title">WERKZEUGBIBLIOTHEK</span></header>
      <div class="fwin-body" id="toolLib"></div>
    </section>
  </main>
</div>
<input type="file" id="fileInput" accept=".ofab,.json" hidden>
<input type="file" id="toolFileInput" accept=".json,.tools,.hsmlib,.xml,.csv,.txt,.tsv" hidden>
<input type="file" id="cadInput" accept=".step,.stp,.igs,.iges,.stl,.obj,.f3d" hidden>
<input type="file" id="dxfInput" accept=".dxf" hidden>
<input type="file" id="machineFileInput" accept=".json" hidden>
<input type="file" id="postFileInput" accept=".json,.cps" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
