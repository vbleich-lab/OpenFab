name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skizze stutzen/verlängern
        run: npm run test:trim
      - name: Skizzenwerkzeuge
        run: npm run test:sketch
      - name: Solver mit Bögen
        run: npm run test:solver
      - name: Rust-Kern (WebAssembly)
        run: npm run test:kernel
      - name: CAM-Bahnen, Postprozessoren, Drehen
        run: npm run test:cam
      - name: Heidenhain Klartext
        run: npm run test:hh
      - name: G-Code (Fanuc, Okuma, LinuxCNC, GRBL, Sinumerik)
        run: npm run test:iso
      - name: Dreh-Postprozessoren (Fanuc, Okuma, LinuxCNC)
        run: npm run test:lathe
      - name: Zeichnung (Maße, Winkel, Hinweise)
        run: npm run test:drawing
      - name: Browser-Version bauen
        run: node tools/build-web.mjs
