name: Release

# Ein Tag wie v1.0.0 oder v1.0.0-rc.2 baut alle Pakete und hängt sie an den Release:
# Windows (Installer und Zip), Linux (AppImage und tar.gz), macOS (dmg für Apple Silicon und Intel)
# und die Browser-Version. Tags mit Bindestrich (rc, beta) werden als Vorabversion veröffentlicht.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version passt zum Tag
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then echo "package.json hat Version $v, Tag ist $TAG"; exit 1; fi
      - name: Release anlegen, falls er fehlt
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            case "$TAG" in *-*) pre=--prerelease ;; *) pre=--latest ;; esac
            gh release create "$TAG" $pre --verify-tag --title "WerkFab ${TAG#v}" --notes "Changes: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md)"
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Windows-App (Ordner) bauen
        run: npm run build
      - name: Windows-Installer bauen
        run: npm run dist:win
      - name: Starttest der gepackten App
        run: node tools/smoke-app.mjs dist/installers/win-unpacked/WerkFab.exe
      - name: Browser-Version bauen
        run: node tools/build-web.mjs
      - name: Pakete packen und hochladen
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          Compress-Archive -Path dist\WerkFab-win32-x64 -DestinationPath "dist\WerkFab-$v-windows-x64-portable.zip"
          Compress-Archive -Path dist\WerkFab-Browser\* -DestinationPath "dist\WerkFab-$v-browser.zip"
          # latest.yml und die Blockmap braucht der eingebaute Updater
          gh release upload $env:TAG "dist\installers\WerkFab-$v-windows-x64-setup.exe" "dist\installers\WerkFab-$v-windows-x64-setup.exe.blockmap" "dist\installers\latest.yml" "dist\WerkFab-$v-windows-x64-portable.zip" "dist\WerkFab-$v-browser.zip" --clobber

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Linux-App bauen (AppImage, tar.gz)
        run: npm run dist:linux
      - name: Starttest der gepackten App
        run: xvfb-run -a node tools/smoke-app.mjs dist/installers/linux-unpacked/werkfab
      - name: Hochladen
        run: gh release upload "$TAG" dist/installers/WerkFab-${TAG#v}-linux-x86_64.AppImage dist/installers/WerkFab-${TAG#v}-linux-x86_64.tar.gz dist/installers/latest-linux.yml --clobber

  macos:
    needs: prepare
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: macOS-App bauen (dmg für Apple Silicon und Intel)
        run: npm run dist:mac
      - name: Signatur prüfen
        run: |
          for app in dist/installers/mac*/WerkFab.app; do codesign --verify --deep --verbose=1 "$app"; done
      - name: Starttest der gepackten App
        run: node tools/smoke-app.mjs dist/installers/mac-arm64/WerkFab.app/Contents/MacOS/WerkFab
      - name: Hochladen
        run: gh release upload "$TAG" dist/installers/WerkFab-${TAG#v}-macos-arm64.dmg dist/installers/WerkFab-${TAG#v}-macos-x64.dmg --clobber
